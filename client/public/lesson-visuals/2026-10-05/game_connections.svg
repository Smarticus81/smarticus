<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="605" viewBox="0 0 1200 605"><rect width="1200" height="605" rx="24" fill="#FAF8F3"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#153A52"/></marker></defs><text x="35" y="43" font-family="DejaVu Sans" font-size="30" font-weight="bold" text-anchor="start" fill="#153A52">FROM PLAYER TO CREATOR</text><rect x="35" y="80" width="550" height="145" rx="16" fill="#EAF2F6"/><text x="57" y="115" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="start" fill="#153A52">Fortnite</text><text x="57" y="149" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#153A52">Effects + world building</text><text x="57" y="183" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#153A52">Try a portal that opens when a hand gesture</text><text x="57" y="208" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#153A52">is recognised.</text><rect x="620" y="80" width="550" height="145" rx="16" fill="#EAF2F6"/><text x="642" y="115" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="start" fill="#153A52">GTA</text><text x="642" y="149" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#153A52">A city that feels alive</text><text x="642" y="183" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#153A52">Direct a calm camera tour of an original</text><text x="642" y="208" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#153A52">floating neighbourhood.</text><rect x="35" y="245" width="550" height="145" rx="16" fill="#EAF3E8"/><text x="57" y="280" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="start" fill="#153A52">EA SPORTS FC 27</text><text x="57" y="314" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#153A52">Movement + presentation</text><text x="57" y="348" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#153A52">Direct a short entrance or celebration for an</text><text x="57" y="373" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#153A52">original character.</text><rect x="620" y="245" width="550" height="145" rx="16" fill="#EAF3E8"/><text x="642" y="280" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="start" fill="#153A52">Rocket League</text><text x="642" y="314" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#153A52">Responsive controls</text><text x="642" y="348" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#153A52">Build a hover-puck toy with a satisfying</text><text x="642" y="373" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#153A52">trail when it moves.</text><rect x="35" y="410" width="550" height="145" rx="16" fill="#F7EAE5"/><text x="57" y="445" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="start" fill="#153A52">Roblox</text><text x="57" y="479" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#153A52">Reusable world rules</text><text x="57" y="513" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#153A52">Invent a room rule that works on several</text><text x="57" y="538" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#153A52">different objects.</text><rect x="620" y="410" width="550" height="145" rx="16" fill="#F7EAE5"/><text x="642" y="445" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="start" fill="#153A52">Forza Horizon 6</text><text x="642" y="479" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#153A52">Environment + camera</text><text x="642" y="513" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#153A52">Make a short cinematic reveal of your own</text><text x="642" y="538" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#153A52">imaginary vehicle.</text></svg>