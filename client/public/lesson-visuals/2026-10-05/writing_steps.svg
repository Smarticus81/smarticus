<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="1200" height="480" rx="24" fill="#FAF8F3"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#153A52"/></marker></defs><text x="35" y="45" font-family="DejaVu Sans" font-size="27" font-weight="bold" text-anchor="start" fill="#153A52">ONE PARAGRAPH, FOUR CLEAR JOBS</text><rect x="50" y="85" width="1100" height="68" rx="16" fill="#EAF2F6"/><text x="75" y="128" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="start" fill="#153A52">1  MY IDEA</text><text x="440" y="128" font-family="DejaVu Sans" font-size="24" font-weight="normal" text-anchor="start" fill="#153A52">State the claim.</text><rect x="50" y="169" width="1100" height="68" rx="16" fill="#EAF3E8"/><text x="75" y="212" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="start" fill="#153A52">2  EXACT RESULTS</text><text x="440" y="212" font-family="DejaVu Sans" font-size="24" font-weight="normal" text-anchor="start" fill="#153A52">Compare the tests.</text><rect x="50" y="253" width="1100" height="68" rx="16" fill="#F7EAE5"/><text x="75" y="296" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="start" fill="#153A52">3  WHY</text><text x="440" y="296" font-family="DejaVu Sans" font-size="24" font-weight="normal" text-anchor="start" fill="#153A52">Explain the connection.</text><rect x="50" y="337" width="1100" height="68" rx="16" fill="#EAF2F6"/><text x="75" y="380" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="start" fill="#153A52">4  CHECK AGAIN</text><text x="440" y="380" font-family="DejaVu Sans" font-size="24" font-weight="normal" text-anchor="start" fill="#153A52">Name a useful next test.</text></svg>