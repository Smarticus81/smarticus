<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="1200" height="480" rx="24" fill="#FAF8F3"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#153A52"/></marker></defs><text x="35" y="45" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="start" fill="#153A52">TWO MATCHING TRIANGLES FILL ONE RECTANGLE</text><rect x="75" y="140" width="400" height="150" fill="#EAF2F6" stroke="#153A52" stroke-width="4"/><path d="M75 290 L475 290 L475 140 Z" fill="#C99A3D" fill-opacity=".75"/><line x1="75" y1="290" x2="475" y2="140" stroke="#153A52" stroke-width="4"/><text x="255" y="330" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" fill="#153A52">8 units</text><text x="15" y="200" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" fill="#153A52">3</text><text x="590" y="130" font-family="DejaVu Sans" font-size="29" font-weight="bold" text-anchor="start" fill="#153A52">Rectangle: 8 × 3 = 24</text><text x="590" y="195" font-family="DejaVu Sans" font-size="29" font-weight="normal" text-anchor="start" fill="#153A52">One triangle is half.</text><text x="590" y="260" font-family="DejaVu Sans" font-size="29" font-weight="bold" text-anchor="start" fill="#153A52">24 ÷ 2 = 12 square units</text><text x="75" y="400" font-family="DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" fill="#153A52">A square unit is one 1-by-1 square of area.</text></svg>