<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="1200" height="480" rx="24" fill="#FAF8F3"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#153A52"/></marker></defs><text x="35" y="43" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" fill="#153A52">ROME SHARED SOME POWER. IT DID NOT INCLUDE EVERYONE.</text><rect x="35" y="85" width="330" height="220" rx="16" fill="#EAF2F6"/><text x="200" y="135" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="middle" fill="#153A52">CONSULS</text><circle cx="170" cy="180" r="19" fill="#153A52"/><circle cx="230" cy="180" r="19" fill="#153A52"/><text x="200" y="241" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="middle" fill="#153A52">Two leading officials</text><text x="200" y="275" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="middle" fill="#153A52">Usually one-year terms</text><rect x="435" y="85" width="330" height="220" rx="16" fill="#EAF2F6"/><text x="600" y="135" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="middle" fill="#153A52">SENATE</text><circle cx="510" cy="180" r="12" fill="#153A52"/><circle cx="555" cy="180" r="12" fill="#153A52"/><circle cx="600" cy="180" r="12" fill="#153A52"/><circle cx="645" cy="180" r="12" fill="#153A52"/><circle cx="690" cy="180" r="12" fill="#153A52"/><text x="600" y="241" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="middle" fill="#153A52">Influential advisers</text><text x="600" y="275" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="middle" fill="#153A52">Helped shape decisions</text><rect x="835" y="85" width="330" height="220" rx="16" fill="#EAF2F6"/><text x="1000" y="135" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="middle" fill="#153A52">ASSEMBLIES</text><circle cx="910" cy="180" r="12" fill="#153A52"/><circle cx="955" cy="180" r="12" fill="#153A52"/><circle cx="1000" cy="180" r="12" fill="#153A52"/><circle cx="1045" cy="180" r="12" fill="#153A52"/><circle cx="1090" cy="180" r="12" fill="#153A52"/><text x="1000" y="241" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="middle" fill="#153A52">Groups of male citizens</text><text x="1000" y="275" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="middle" fill="#153A52">Voted on laws or officials</text><rect x="35" y="340" width="1130" height="90" rx="16" fill="#F7EAE5"/><text x="65" y="378" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="start" fill="#153A52">LIMIT: women and enslaved people could not vote.</text><text x="65" y="412" font-family="DejaVu Sans" font-size="23" font-weight="normal" text-anchor="start" fill="#153A52">Even among citizens, wealth and social position affected power.</text></svg>