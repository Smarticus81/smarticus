<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390"><rect width="1200" height="390" rx="25" fill="#FAF8F3"/><style>text{font-family:DejaVu Sans;fill:#153A52}.title{font-size:27px;font-weight:bold}.body{font-size:24px}</style><text x="35" y="45" class="title">BUILD A PATH. ADD A FLAG. REACH THE FINISH.</text><rect x="65" y="150" width="150" height="65" rx="10" fill="#78B5A0"/><text x="125" y="193" class="title">1</text><text x="65" y="260" class="body">Start</text><rect x="295" y="150" width="150" height="65" rx="10" fill="#78B5A0"/><text x="355" y="193" class="title">2</text><text x="295" y="260" class="body">Jump</text><rect x="525" y="150" width="150" height="65" rx="10" fill="#D5A23F"/><text x="585" y="193" class="title">3</text><path d="M600 150 v-55 h45 v25 h-45" stroke="#9A7121" stroke-width="5" fill="#E8B34C"/><text x="525" y="260" class="body">Checkpoint</text><rect x="755" y="110" width="150" height="65" rx="10" fill="#78B5A0"/><text x="815" y="153" class="title">4</text><text x="755" y="260" class="body">Turn left</text><rect x="985" y="150" width="150" height="65" rx="10" fill="#49CAD0"/><text x="1045" y="193" class="title">5</text><path d="M1010 150 v-65 h100 v65" fill="none" stroke="#153A52" stroke-width="9"/><text x="985" y="260" class="body">Finish</text><text x="35" y="330" class="body">Build → Add platform     Play → Try your jumps     Download save → Keep it</text></svg>