<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="1200" height="480" rx="24" fill="#FAF8F3"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#153A52"/></marker></defs><text x="35" y="45" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" fill="#153A52">A CLUE CAN FIT MORE THAN ONE STORY</text><rect x="40" y="100" width="335" height="250" rx="16" fill="#EAF2F6"/><text x="75" y="145" font-family="DejaVu Sans" font-size="23" font-weight="bold" text-anchor="start" fill="#153A52">INVENTED DETAIL</text><text x="75" y="195" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" fill="#153A52">Mina has a wet umbrella.</text><text x="75" y="235" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#153A52">Page 6</text><text x="75" y="303" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" fill="#153A52">This is what we know.</text><line x1="395" y1="205" x2="470" y2="150" stroke="#153A52" stroke-width="4" marker-end="url(#arrow)"/><line x1="395" y1="235" x2="470" y2="315" stroke="#153A52" stroke-width="4" marker-end="url(#arrow)"/><rect x="490" y="85" width="660" height="130" rx="16" fill="#EAF3E8"/><text x="525" y="131" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="start" fill="#153A52">IDEA A: she walked in the rain.</text><text x="525" y="177" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#153A52">Possible, but not proved.</text><rect x="490" y="255" width="660" height="130" rx="16" fill="#F7EAE5"/><text x="525" y="301" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="start" fill="#153A52">IDEA B: she borrowed a wet umbrella.</text><text x="525" y="347" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#153A52">A different explanation also fits.</text><text x="50" y="438" font-family="DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" fill="#153A52">Next: look for a new detail that separates the two ideas.</text></svg>