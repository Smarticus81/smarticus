<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="1200" height="480" rx="24" fill="#FAF8F3"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#153A52"/></marker></defs><text x="35" y="42" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="start" fill="#153A52">HEIGHT IS A DISTANCE, NOT AN ADDRESS</text><line x1="75" y1="90" x2="75" y2="365" stroke="#C8D5DC" stroke-width="1"/><line x1="130" y1="90" x2="130" y2="365" stroke="#C8D5DC" stroke-width="1"/><line x1="185" y1="90" x2="185" y2="365" stroke="#C8D5DC" stroke-width="1"/><line x1="240" y1="90" x2="240" y2="365" stroke="#C8D5DC" stroke-width="1"/><line x1="295" y1="90" x2="295" y2="365" stroke="#C8D5DC" stroke-width="1"/><line x1="350" y1="90" x2="350" y2="365" stroke="#C8D5DC" stroke-width="1"/><line x1="405" y1="90" x2="405" y2="365" stroke="#C8D5DC" stroke-width="1"/><line x1="460" y1="90" x2="460" y2="365" stroke="#C8D5DC" stroke-width="1"/><line x1="75" y1="90" x2="460" y2="90" stroke="#C8D5DC" stroke-width="1"/><line x1="75" y1="145" x2="460" y2="145" stroke="#C8D5DC" stroke-width="1"/><line x1="75" y1="200" x2="460" y2="200" stroke="#C8D5DC" stroke-width="1"/><line x1="75" y1="255" x2="460" y2="255" stroke="#C8D5DC" stroke-width="1"/><line x1="75" y1="310" x2="460" y2="310" stroke="#C8D5DC" stroke-width="1"/><line x1="75" y1="365" x2="460" y2="365" stroke="#C8D5DC" stroke-width="1"/><rect x="130" y="145" width="275" height="220" fill="#EAF2F6" fill-opacity=".5" stroke="#153A52" stroke-width="4"/><line x1="405" y1="365" x2="405" y2="145" stroke="#C99A3D" stroke-width="8"/><circle cx="405" cy="365" r="8" fill="#C99A3D"/><circle cx="405" cy="145" r="8" fill="#C99A3D"/><text x="425" y="370" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" fill="#153A52">B (7,1)</text><text x="425" y="140" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" fill="#153A52">C (7,5)</text><rect x="610" y="100" width="550" height="280" rx="16" fill="#EAF2F6"/><text x="640" y="145" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" fill="#153A52">1  Choose the SAME vertical side.</text><text x="640" y="192" font-family="DejaVu Sans" font-size="24" font-weight="normal" text-anchor="start" fill="#153A52">2  The x address stays 7.</text><text x="640" y="239" font-family="DejaVu Sans" font-size="24" font-weight="normal" text-anchor="start" fill="#153A52">3  y changes from 1 to 5.</text><text x="640" y="299" font-family="DejaVu Sans" font-size="29" font-weight="bold" text-anchor="start" fill="#153A52">Height: 5 - 1 = 4 units</text><text x="640" y="346" font-family="DejaVu Sans" font-size="23" font-weight="normal" text-anchor="start" fill="#153A52">Count four gaps to check.</text><text x="150" y="425" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" fill="#153A52">Width: 7 - 2 = 5 units</text><text x="620" y="430" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" fill="#153A52">Area: 5 × 4 = 20 square units</text></svg>