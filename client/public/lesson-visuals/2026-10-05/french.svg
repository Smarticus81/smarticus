<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="1200" height="480" rx="24" fill="#FAF8F3"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#153A52"/></marker></defs><text x="35" y="45" font-family="DejaVu Sans" font-size="29" font-weight="bold" text-anchor="start" fill="#153A52">YOU ASK WITH TU. I ANSWER WITH JE.</text><circle cx="140" cy="180" r="45" fill="#153A52"/><path d="M75 300 Q140 210 205 300" fill="#C99A3D"/><text x="140" y="350" font-family="DejaVu Sans" font-size="27" font-weight="bold" text-anchor="middle" fill="#153A52">YOU</text><circle cx="1030" cy="180" r="45" fill="#153A52"/><path d="M965 300 Q1030 210 1095 300" fill="#C99A3D"/><text x="1030" y="350" font-family="DejaVu Sans" font-size="27" font-weight="bold" text-anchor="middle" fill="#153A52">ME</text><rect x="255" y="90" width="650" height="105" rx="16" fill="#EAF2F6"/><text x="280" y="140" font-family="DejaVu Sans" font-size="28" font-weight="normal" text-anchor="start" fill="#153A52">Est-ce que tu vas dessiner ?</text><text x="280" y="178" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" fill="#153A52">Are you going to draw?</text><rect x="255" y="230" width="650" height="105" rx="16" fill="#EAF3E8"/><text x="280" y="276" font-family="DejaVu Sans" font-size="28" font-weight="normal" text-anchor="start" fill="#153A52">Oui, je vais dessiner.</text><text x="280" y="314" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" fill="#153A52">Yes, I am going to draw.</text><text x="260" y="415" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" fill="#153A52">No: Je ne vais pas dessiner.</text></svg>