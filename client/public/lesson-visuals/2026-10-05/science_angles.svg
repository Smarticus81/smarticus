<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="1200" height="480" rx="24" fill="#FAF8F3"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#153A52"/></marker></defs><text x="35" y="43" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" fill="#153A52">MEASURE FROM THE DASHED NORMAL</text><line x1="70" y1="350" x2="510" y2="350" stroke="#153A52" stroke-width="8"/><line x1="290" y1="65" x2="290" y2="350" stroke="#C99A3D" stroke-width="4" stroke-dasharray="10 9"/><line x1="110" y1="170" x2="290" y2="350" stroke="#153A52" stroke-width="4" marker-end="url(#arrow)"/><line x1="290" y1="350" x2="470" y2="170" stroke="#153A52" stroke-width="4" marker-end="url(#arrow)"/><circle cx="290" cy="350" r="8" fill="#C99A3D"/><path d="M290 320 L320 320 L320 350" fill="none" stroke="#153A52" stroke-width="3"/><text x="62" y="398" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" fill="#153A52">mirror</text><text x="310" y="90" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" fill="#153A52">normal</text><text x="320" y="333" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#153A52">90°</text><text x="155" y="275" font-family="DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" fill="#153A52">45°</text><text x="355" y="275" font-family="DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" fill="#153A52">45°</text><text x="70" y="130" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#153A52">incoming</text><text x="400" y="130" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#153A52">outgoing</text><rect x="660" y="100" width="500" height="280" rx="16" fill="#EAF2F6"/><text x="690" y="150" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" fill="#153A52">1  Mark the hit point.</text><text x="690" y="210" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" fill="#153A52">2  Add the normal at 90°.</text><text x="690" y="270" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" fill="#153A52">3  Match both ray angles.</text><text x="690" y="330" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#153A52">The normal turns with the mirror.</text></svg>